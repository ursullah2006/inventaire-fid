{% extends "base.html" %}
{% block titre %}Ajouter un matériel{% endblock %}

{% block contenu %}
<a href="{{ url_for('materiel_liste', categorie_id=categorie['id']) }}" class="lien-retour">← Retour à {{ categorie['nom'] }}</a>
<h1>➕ Ajouter un matériel — {{ categorie['nom'] }}</h1>

<form method="post" class="form-materiel">
    <label>Type</label>
    <input type="text" name="type" value="{{ valeurs.get('type', '') }}" placeholder="Ex: Ordinateur, Chaise, Camion...">

    <label>Code IMMO <span class="obligatoire">(unique, obligatoire)</span></label>
    <input type="text" name="code_immo" value="{{ valeurs.get('code_immo', '') }}" required placeholder="Ex: IMMO-0001">

    <label>Nom du matériel</label>
    <input type="text" name="nom" value="{{ valeurs.get('nom', '') }}" required>

    <label>Statut</label>
    <select name="statut">
        {% for s in statuts %}
            <option value="{{ s }}" {% if valeurs.get('statut') == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select>

    <label>Responsable / Affecté à</label>
    <input type="text" name="responsable" value="{{ valeurs.get('responsable', '') }}" placeholder="Nom de la personne ou du service">

    <label>Prix</label>
    <input type="number" step="0.01" name="prix" value="{{ valeurs.get('prix', '') }}">

    <label>Projet</label>
    <input type="text" name="projet" value="{{ valeurs.get('projet', '') }}">

    <label>Fournisseur</label>
    <input type="text" name="fournisseur" value="{{ valeurs.get('fournisseur', '') }}">

    <label>Date</label>
    <input type="date" name="date_materiel" value="{{ valeurs.get('date_materiel', '') }}">

    <div class="form-actions">
        <button type="submit">Enregistrer</button>
        <a href="{{ url_for('materiel_liste', categorie_id=categorie['id']) }}" class="btn-annuler">Annuler</a>
    </div>
</form>
{% endblock %}
